name: Checks
on:
  pull_request:
  push:
    branches: [audit-opt]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools
          cd .tools
          curl --fail --silent --show-error --location --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --output checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          expected=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' checksums.txt)
          test -n "$expected"
          echo "$expected  gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf gitleaks.tar.gz gitleaks
      - run: npm run secrets:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:seed
      - name: Verify repeatable setup
        run: |
          npm run db:migrate
          npm run db:seed
      - run: npm run test:db
      - if: always()
        run: npm run db:stop
  e2e:
    # P35: critical journeys with Playwright against local Supabase and a simulated OpenAI.
    # Not a required check yet (decision 2 of wave 8). No repository secrets are used.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # The runner's Google Chrome: no Playwright browser download.
      E2E_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:seed
      - run: npm run test:e2e
      - name: Upload Playwright report (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/playwright/
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: npm run db:stop
